<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payo mobile app </title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-[#faf7f7] h-[100vh]">
    <form class="min-h-screen flex justify-center items-center flex-col " >
        <div class="h-[110px] w-[300px] bg-[url('./assets/bg.png')] bg-cover flex justify-center items-center ">
            <img src="./assets/Group.png" alt="">

        </div>
        <div class="bg-white p-10 rounded-xl">
            <div class="mb-5">
                <label for="" class="font-semibold">Mobile number</label>
                <input id="mobile" type="number" placeholder="Enter your number" class="input mt-3 rounded-3xl" />
            </div>
            <div class="mb-5">
                <label for="" class="font-semibold"">4 Dizzy pen </label>
                <input id="pin" type="number" placeholder="Enter your pin" class="input mt-3 rounded-3xl" />
            </div>
            <button  id="Loginbutton" class="btn  w-full rounded-3xl bg-[#0874F2] text-white font-semibold ">Login</button>
        </div>
    </form>

        <script src="/script.js"></script>
</body>

</html>
